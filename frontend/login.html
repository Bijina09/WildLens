<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wild Lens | Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Outfit", Arial, sans-serif;
      }

      body {
        height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        background:
          linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)),
          url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80");

        background-size: cover;

        background-position: center;
      }

      /* OVERLAY */

      .overlay {
        position: absolute;

        width: 100%;

        height: 100%;

        background: rgba(0, 0, 0, 0.35);
      }

      /* LOGIN BOX */

      .login-box {
        position: relative;

        z-index: 10;

        width: 420px;

        padding: 40px;

        border-radius: 25px;

        background: rgba(255, 255, 255, 0.1);

        backdrop-filter: blur(18px);

        border: 1px solid rgba(255, 255, 255, 0.15);

        color: white;

        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .login-box h2 {
        text-align: center;

        font-size: 34px;

        font-weight: 800;
      }

      .login-box h2 span {
        color: #37ff8b;
      }

      .login-box p {
        text-align: center;

        color: #ddd;

        margin-bottom: 30px;
      }

      label {
        color: white;

        font-weight: 500;
      }

      .form-control,
      .form-select {
        background: rgba(255, 255, 255, 0.15);

        border: 1px solid rgba(55, 255, 139, 0.3);

        color: white;
      }

      .form-control::placeholder {
        color: #ddd;
      }

      .form-control:focus,
      .form-select:focus {
        background: rgba(255, 255, 255, 0.2);

        color: white;

        border-color: #37ff8b;

        box-shadow: 0 0 15px rgba(55, 255, 139, 0.4);
      }

      .form-select option {
        background: #102218;

        color: white;
      }

      .input-group-text {
        background: rgba(255, 255, 255, 0.15);

        border: none;

        color: white;

        cursor: pointer;
      }

      .btn-login {
        width: 100%;

        padding: 13px;

        background: #37ff8b;

        border: none;

        border-radius: 30px;

        color: #06150d;

        font-weight: 800;

        font-size: 18px;

        transition: 0.3s;
      }

      .btn-login:hover {
        box-shadow: 0 0 30px #37ff8b;

        transform: translateY(-3px);
      }

      .bottom-links {
        text-align: center;

        margin-top: 25px;
      }

      .bottom-links a {
        color: #37ff8b;

        text-decoration: none;

        font-weight: 600;
      }

      .bottom-links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="overlay"></div>

    <div class="login-box">
      <h2>🌿 Wild <span>Lens</span></h2>

      <p>AI Powered Wildlife Monitoring</p>

      <form id="loginForm">
        <!-- <div class="mb-3">
          <label> Login As </label>

          <select class="form-select" id="role">
            <option value="user">User</option>

            <option value="admin">Admin</option>
          </select>
        </div> -->

        <div class="mb-3">
          <label> Email </label>

          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Enter Email"
            required
          />
        </div>

        <div class="mb-3">
          <label> Password </label>

          <div class="input-group">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter Password"
              required
            />

            <span class="input-group-text" onclick="togglePassword()">
              <i class="fa-solid fa-eye" id="eye"> </i>
            </span>
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" />

          <label class="form-check-label"> Remember Me </label>
        </div>

        <button class="btn-login">Login</button>
      </form>

      <div class="bottom-links">
        <p>
          Don't have an account?

          <a href="signup.html"> Sign Up </a>
        </p>

        <p>
          <a href="index.html"> ← Back to Home </a>
        </p>
      </div>
    </div>
    <script src="toast.js"></script>
    <script>
      // PASSWORD SHOW / HIDE

      function togglePassword() {
        let password = document.getElementById("password");

        let eye = document.getElementById("eye");

        if (password.type === "password") {
          password.type = "text";

          eye.classList.remove("fa-eye");

          eye.classList.add("fa-eye-slash");
        } else {
          password.type = "password";

          eye.classList.remove("fa-eye-slash");

          eye.classList.add("fa-eye");
        }
      }

      // LOGIN SYSTEM

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            const res = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
              }),
            });
            const data = await res.json();
            if (!res.ok) return showToast(data.error, "error");

            // app.js still reads currentUser for the sidebar/topbar display only
            localStorage.setItem("currentUser", JSON.stringify(data.user));
            showToast("Login successful! Welcome, " + data.user.name);
            setTimeout(() => {
              window.location.href =
                data.user.role === "admin"
                  ? "admin-dashboard.html"
                  : "user-dashboard.html";
            }, 1200);
          } catch {
            showToast("Cannot reach the server", "error");
          }
        });
    </script>
  </body>
</html>
